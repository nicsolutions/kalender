<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender Tahunan A4 — Masehi &amp; Hijriah</title>

<!-- CSS Modular -->
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="calendar.css">
<link rel="stylesheet" href="print.css">
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
  <div class="blob blob-d"></div>

<div class="controls">
  <label for="yearInput">Tahun</label>
  <input type="number" id="yearInput" value="2026" min="2000" max="2100">

  <label for="themeSelect">Tema</label>
  <select id="themeSelect" onchange="applyTheme(this.value)">
    <option value="">🌸 Pastel Asli</option>
    <option value="lazy-summer">🌻 Lazy Summer</option>
    <option value="ocean">🌊 Ocean Breeze</option>
    <option value="desert-oasis">🏜️ Desert Oasis</option>
  </select>

  <button onclick="renderFullYear()">Tampilkan Kalender</button>
  <button class="secondary" onclick="window.print()">Cetak / Simpan PDF</button>
</div>

<div class="a4-page">
  <div class="frame-band"></div>

  <div class="calendar-header">
    <div class="header-row">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 1L14.5 8.5L22 11L14.5 13.5L12 21L9.5 13.5L2 11L9.5 8.5Z" fill="#a3792f"/></svg>
      <h1 id="calendarTitle">Kalender 2026</h1>
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 1L14.5 8.5L22 11L14.5 13.5L12 21L9.5 13.5L2 11L9.5 8.5Z" fill="#a3792f"/></svg>
    </div>
    <div class="subtitle" id="calendarSubtitle">التقويم الميلادي والهجري</div>
    <div class="legend">
      <span><i class="dot-holiday"></i> Hari Minggu &amp; libur nasional</span>
      <span><i class="dot-fasting"></i> Jadwal Puasa</span>
      <span><i class="dot-hijri"></i> Tanggal Hijriah (dalam huruf Arab)</span>
    </div>
    <div class="data-warning" id="dataWarning"></div>
  </div>

  <div class="months-grid" id="monthsContainer"></div>

  <div class="frame-band bottom"></div>
</div>

<!-- JavaScript Modular (urutan penting: hijri → holidays → calendar) -->
<script src="hijri.js"></script>
<script src="holidays.js"></script>
<script src="calendar.js"></script>

</body>
</html>
